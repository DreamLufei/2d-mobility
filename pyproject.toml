[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-agent"
version = "0.2.0"
description = "Postgres-first LangGraph runtime for first-principles 2D carrier mobility and VASP Wiki RAG."
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1,<2",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "langgraph==1.1.6",
  "langgraph-checkpoint-postgres==3.0.5",
  "langchain==1.2.15",
  "langchain-core==1.2.28",
  "langchain-openai==1.1.12",
  "langchain-postgres==0.0.17",
  "langchain-text-splitters>=1,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.1,<3",
  "pymatgen>=2024,<2027",
  "pymongo>=4.6,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mobility_agent*"]
